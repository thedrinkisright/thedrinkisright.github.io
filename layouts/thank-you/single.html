{{ define "main" }}
<section class="thankyou-section" id="thankyou-section" data-nav-theme="dark" hidden>
  <article class="thankyou-letter">
    <a href="/" class="thankyou-masthead" aria-label="The Drink Is Right — Home">
      <img src="{{ "/images/logo-email-masthead.jpg" | relURL }}" alt="" width="520" height="345">
    </a>
    <div class="thankyou-letter-body">
      <h1>We'll be in touch.</h1>
      <p id="thankyou-details" hidden></p>
      <p id="thankyou-followup"></p>
      <p class="thankyou-signoff">The Drink Is Right<br><span>New York City</span></p>
    </div>
  </article>
</section>
<script>
  (function () {
    var preview = /(?:\?|&)preview=1(?:&|$)/.test(window.location.search);
    var copy = null;
    try {
      copy = JSON.parse(sessionStorage.getItem('tdrBookingCopy') || 'null');
    } catch (err) {
      copy = null;
    }
    var allowed = preview;
    try {
      if (sessionStorage.getItem('tdrBookingComplete') === '1') allowed = true;
    } catch (err) {}
    if (!allowed) {
      window.location.replace('/');
      return;
    }

    if (!copy || typeof copy !== 'object') {
      copy = preview
        ? {
            details: 'We received your request for a wedding on June 14, 2026 at 6:00 PM — 4 hours, 75 guests.',
            followUp: 'We typically respond within 24 hours.'
          }
        : {
            details: '',
            followUp: 'We received your booking request and typically respond within 24 hours.'
          };
    }

    var detailsEl = document.getElementById('thankyou-details');
    var followEl = document.getElementById('thankyou-followup');
    if (copy.details && detailsEl) {
      detailsEl.textContent = copy.details;
      detailsEl.hidden = false;
    }
    if (followEl) {
      followEl.textContent = copy.followUp || 'We typically respond within 24 hours.';
    }

    var el = document.getElementById('thankyou-section');
    if (el) el.hidden = false;
  })();
</script>
{{ end }}
