baseURL = "https://www.thedrinkisright.com/"
languageCode = "en-us"
title = "The Drink Is Right"

# GitHub Pages image cache location
cacheDir = "/tmp/hugo_cache"

# No category/tag archive pages (empty taxonomies)
disableKinds = ["taxonomy", "term"]

[params]
  tagline     = "The Right Drink For Every Experience"
  description = "Elevated mobile bartending for weddings, birthdays & private events across NYC."
  phone       = "(929) 235-8606"
  email       = "info@thedrinkisright.com"
  quoteURL    = "https://forms.gle/rXCxw14ytjveiWHK7"
  location    = "Serving NYC & Surrounding Areas"
  images      = ["images/og-share.jpg"]
  # Google Maps JavaScript API key (enable Maps JavaScript API + Places API).
  # Restrict the key to your domain(s). Leave empty to keep a plain text location field.
  googleMapsApiKey = ""

[markup.goldmark.renderer]
  unsafe = true
